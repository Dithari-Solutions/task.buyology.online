services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: buyology-kanban-web:latest
    container_name: buyology-kanban-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side proxy target - changing this needs no rebuild.
      # Reaches the API container by name over the shared network.
      BACKEND_URL: ${BACKEND_URL:-http://buyology-kanban-api:8080}
    ports:
      # Bound to loopback by default - only the reverse proxy on this host may reach it.
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-6061}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kanban-web
      - shared

networks:
  kanban-web:
    name: buyology-kanban-web-net
    driver: bridge
  shared:
    name: ${SHARED_NETWORK:-buyology-kanban-shared}
    external: true
